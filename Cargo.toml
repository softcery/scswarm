[package]
name = "scswarm"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Autonomous task swarm: board in git, worker per worktree and container, agent sessions as scripted turns."
authors = ["Elijah Atamas"]
publish = false

[[bin]]
name = "scswarm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
