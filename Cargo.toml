[package]
name = "scswarm"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
description = "Run coding agents on tracks of queued work in git, one worktree and container per row."
authors = ["Elijah Atamas"]
license = "MIT"
repository = "https://github.com/softcery/scswarm"
publish = false

[[bin]]
name = "scswarm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
clap_complete = "4"
clap_mangen = "0.3"
