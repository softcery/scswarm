image: Containerfile.swarm
default_agent: claude
agents:
  claude:
    exec: CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1 claude-swarm --dangerously-skip-permissions --disallowedTools Agent Skill SendMessage ListAgents RemoteTrigger PushNotification -p --output-format json
    resume: --resume {session}
commit: "Reply with the commit message for the work in this session, in Conventional Commits format per CONTRIBUTING.md. Message only, plain text: no quotes, backticks or code fence."
merge:
  - "This worktree holds a conflicted merge of row {id} into branch {parent}. Read both sides, resolve every conflict so both intents survive, run `make lint`."
  - "Conflict markers gone, build and lint clean?"
  - run: make lint
  - commit:
